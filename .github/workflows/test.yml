name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-http.txt
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          GEMINI_HTTP_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npm pack --ignore-scripts --dry-run
